name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup Python (sidecar)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Build sidecar exe
        run: |
          cd sidecar
          uv venv
          uv pip install pyinstaller --python .venv\Scripts\python.exe
          .venv\Scripts\pyinstaller.exe bidcraft-sidecar.spec --noconfirm
          New-Item -ItemType Directory -Force -Path "../release/sidecar" | Out-Null
          Copy-Item "dist/bidcraft-sidecar.exe" "../release/sidecar/bidcraft-sidecar.exe" -Force
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BidCraft v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
