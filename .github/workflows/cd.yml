name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  release:
    name: Build & Publish
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup Python (sidecar)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Resolve uv cache paths
        id: uv-paths
        run: |
          echo "py_dir=$((uv python dir).Trim())" >> $env:GITHUB_OUTPUT
          echo "cache_dir=$((uv cache dir).Trim())" >> $env:GITHUB_OUTPUT

      # 命中后免重复下载：可重定位 Python、uv wheel 缓存
      # 模型改为从仓库固定 Release（tag models-pdf-extract-kit-v1）下载，无需缓存 modelscope
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.uv-paths.outputs.py_dir }}
            ${{ steps.uv-paths.outputs.cache_dir }}
          key: mineru-3.4.5-py3.12-${{ runner.os }}-v2

      # PyInstaller 分析 app/main.py 依赖，.venv 必须先 uv sync 完整依赖
      # （历史缺陷：旧流程只 uv venv 空环境，打出的 exe 缺模块）
      - name: Prepare sidecar venv (uv sync + pyinstaller)
        run: |
          uv sync --frozen --directory sidecar
          uv pip install pyinstaller --python sidecar\.venv\Scripts\python.exe

      - name: Build sidecar exe (PyInstaller -> build-staging/sidecar)
        run: npm run stage:sidecar

      # runner 无 GPU：PyPI 默认 wheel 即 CPU 版 torch；模型从固定 Release 资产下载
      # （不走 models_download：master 已膨胀到 ~2.6GB，会让 NSIS 32 位 makensis mmap 失败）
      - name: Build MinerU runtime and pipeline models
        timeout-minutes: 40
        run: npm run stage:mineru

      - name: Build NSIS installer (bundles sidecar + MinerU)
        run: npm run dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BidCraft v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
