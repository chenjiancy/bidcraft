[project]
name = "bidcraft-sidecar"
version = "0.1.0"
description = "BidCraft Python sidecar（FastAPI）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "docxtpl>=0.18",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pypdf>=6.19.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34",
    "rapidocr>=3.8",
    "onnxruntime>=1.30.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.4",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# scripts/ 为走查/诊断脚本（非生产代码）：放宽格式类规则
[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E501", "E701", "E702", "E722"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "engine: 需要本机 MinerU venv/样本的真实解析测试（无环境自动 skip，CI 不装）",
    "slow: 耗时较长的测试（如扫描件 OCR）",
]

[tool.uv]
package = false
